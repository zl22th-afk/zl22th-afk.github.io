<script>
/**
 * 掼蛋计分核心逻辑（纯函数，无 wx 依赖，可在 Node 中测试）
 * 规则依据：国家体育总局棋牌运动管理中心《竞技掼蛋竞赛规则（试行）》、《江苏省掼蛋竞赛简易规则（2017）》
 *  - 只有上游（头游）方升级：搭档二游升3级，三游升2级，下游升1级
 *  - 级数 2→A，A 必打（升级最多升到 A，不能跳过 A）
 *  - 过A：打A级的一方一家为上游、搭档不是下游（即 1、2游 或 1、3游）
 *  - 可选：打A失败次数上限（民间/淮安/南京规则：3次或2次不过回到2）
 *  - v1.1 自定义过A规则（均按场保存在 match.rules，缺省值 = 旧版行为，旧比赛重放结果不变）：
 *      passAWin            过A所需胜法：'double' 仅双上 / 'd13' 双上或1、3游（默认）/ 'any' 任意头游获胜
 *      aFailLimit          打A失败次数上限：0 不限，1–5 次
 *      aFailReturn         达到上限后回到的级（2–K，默认 2）
 *      aFailResetOnLoseDeal 失去庄位时失败次数清零（默认否）：只累计“连续坐庄打A”的失败
 */
'use strict';

var LEVEL_MIN = 2;
var LEVEL_A = 14;
var LEVEL_PASS = 15; // 过A

var LEVEL_NAMES = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: 'A+' };

function levelName(lv) {
  if (LEVEL_NAMES[lv]) return LEVEL_NAMES[lv];
  return String(lv);
}

// 6 种本方名次输入（team 0 = 本方/我方）
var RESULTS = [
  { code: '12', label: '双上', sub: '1、2游', pos: [1, 2] },
  { code: '13', label: '1、3游', sub: '升2级', pos: [1, 3] },
  { code: '14', label: '1、4游', sub: '升1级', pos: [1, 4] },
  { code: '23', label: '2、3游', sub: '对方升1级', pos: [2, 3] },
  { code: '24', label: '2、4游', sub: '对方升2级', pos: [2, 4] },
  { code: '34', label: '双下', sub: '3、4游', pos: [3, 4] }
];
var RESULT_MAP = {};
RESULTS.forEach(function (r) { RESULT_MAP[r.code] = r; });

var DEFAULT_RULES = {
  passARequireOwnLevel: true, // 过A须在本方打A时（本方为庄）
  aFailLimit: 0,              // 打A失败次数上限：0=不限（国家规则），1–5 = 达到后回到 aFailReturn
  passAWin: 'd13',            // 过A所需胜法：'double' | 'd13' | 'any'
  aFailReturn: 2,             // 打A失败达上限后回到的级
  aFailResetOnLoseDeal: false // 失去庄位时失败次数清零
};
var PASS_A_WINS = { double: '仅双上', d13: '双上或1、3游', any: '任意头游获胜' };

/** 规范化规则（createMatch 用）：缺省字段按旧版默认补齐 */
function normalizeRules(r) {
  r = Object.assign({}, DEFAULT_RULES, r || {});
  var lim = Number(r.aFailLimit);
  r.aFailLimit = lim >= 0 && lim <= 5 && Math.floor(lim) === lim ? lim : 0;
  r.passARequireOwnLevel = !!r.passARequireOwnLevel;
  r.passAWin = PASS_A_WINS[r.passAWin] ? r.passAWin : 'd13';
  var ret = parseInt(r.aFailReturn, 10);
  r.aFailReturn = ret >= LEVEL_MIN && ret < LEVEL_A ? ret : LEVEL_MIN;
  r.aFailResetOnLoseDeal = !!r.aFailResetOnLoseDeal;
  return r;
}

/** 重放用规则：旧比赛的 rules 原样解释（不补 passARequireOwnLevel），只给新增字段补默认值 */
function replayRules(r) {
  r = r || DEFAULT_RULES;
  var ret = parseInt(r.aFailReturn, 10);
  return {
    passARequireOwnLevel: !!r.passARequireOwnLevel,
    aFailLimit: Number(r.aFailLimit) > 0 ? Number(r.aFailLimit) : 0,
    passAWin: PASS_A_WINS[r.passAWin] ? r.passAWin : 'd13',
    aFailReturn: ret >= LEVEL_MIN && ret < LEVEL_A ? ret : LEVEL_MIN,
    aFailResetOnLoseDeal: !!r.aFailResetOnLoseDeal
  };
}

/** 本次胜法是否满足过A条件（只看胜法，不看是否本方打A） */
function winPassesA(rules, gain) {
  if (rules.passAWin === 'double') return gain === 3;
  if (rules.passAWin === 'any') return true;
  return gain >= 2;
}

/** 规则摘要（界面/分享图显示） */
function ruleSummary(r) {
  r = replayRules(r);
  var parts = [
    r.passARequireOwnLevel ? '须打本方A' : '在A即可过A',
    PASS_A_WINS[r.passAWin] + '过A',
    r.aFailLimit ? '打A' + r.aFailLimit + '次不过回' + levelName(r.aFailReturn) : '打A不限次数'
  ];
  if (r.aFailResetOnLoseDeal && r.aFailLimit > 1) parts.push('丢庄清零'); // 上限为 0/1 时该选项不会生效，不显示
  return parts.join(' · ');
}

function posText(pos) { return pos[0] + '、' + pos[1] + '游'; }

/** 根据本方名次推导对方名次、胜方、升级数 */
function analyze(code) {
  var r = RESULT_MAP[code];
  if (!r) throw new Error('无效的名次输入: ' + code);
  var opp = [1, 2, 3, 4].filter(function (p) { return r.pos.indexOf(p) < 0; });
  var winner = r.pos[0] === 1 ? 0 : 1;
  var winPos = winner === 0 ? r.pos : opp;
  var partner = winPos[1];
  var gain = partner === 2 ? 3 : partner === 3 ? 2 : 1;
  return { code: code, ourPos: r.pos.slice(), oppPos: opp, winner: winner, gain: gain, isDouble: gain === 3 };
}

function clampLevel(lv) {
  lv = parseInt(lv, 10);
  if (isNaN(lv) || lv < LEVEL_MIN) return LEVEL_MIN;
  if (lv > LEVEL_A) return LEVEL_A;
  return lv;
}

var NAME_MAX = 8;

var COMBINING = /^[\u0300-\u036f\u1ab0-\u1aff\u1dc0-\u1dff\u20d0-\u20ff\ufe20-\ufe2f\u200d\ufe0e\ufe0f]/;
function createMatch(opts, now) {
  opts = opts || {};
  var rules = normalizeRules(opts.rules);
  var names = [
    (opts.nameA || '').trim() || '我方',
    (opts.nameB || '').trim() || '对方'
  ];
  if (names[0] === names[1]) {
    // 同名时给对方加“2”，并保证总长度不超过 NAME_MAX 个字符（按码点截断，不切开 emoji）
    // 1.1.2：若截断后恰好又与本方同名（如本方“一二三四五六七2”），依次改用 3、4…
    var cps = names[1].match(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\s\S]/g) || [];
    for (var k = 2; k < 100; k++) {
      var keep = cps.slice(0, NAME_MAX - String(k).length);
      // 1.1.2 复核 L5：截断处若切开了“基字 + 组合附加符号”，把这个不完整的字整个去掉
      if (cps.length > keep.length && COMBINING.test(cps[keep.length])) { while (keep.length > 1 && COMBINING.test(keep[keep.length - 1])) keep.pop(); if (keep.length > 1) keep.pop(); }
      var cand = keep.join('') + k;
      if (cand !== names[0]) { names[1] = cand; break; }
    }
  }
  var start = [clampLevel(opts.startA == null ? 2 : opts.startA), clampLevel(opts.startB == null ? 2 : opts.startB)];
  var t = now == null ? Date.now() : now;
  return {
    id: 'm' + t + Math.floor(Math.random() * 1000),
    names: names,
    startLevels: start,
    firstDealer: opts.firstDealer === 1 ? 1 : 0,
    rules: rules,
    hands: [],
    manualEnd: null, // {at}
    createdAt: t
  };
}

/** 从初始设置重放所有手牌，得到完整状态（撤销=删掉最后一手后重放，保证严谨） */
function replay(match) {
  var rules = replayRules(match.rules);
  var levels = match.startLevels.slice();
  var dealer = match.firstDealer;
  var aFails = [0, 0];
  var mainPoints = [0, 0];
  var counts = [{ '3': 0, '2': 0, '1': 0 }, { '3': 0, '2': 0, '1': 0 }];
  var winner = null;
  var records = [];

  for (var i = 0; i < match.hands.length; i++) {
    if (winner !== null) break; // 已过A，后续无效（正常不会出现）
    var a = analyze(match.hands[i].code);
    var w = a.winner, l = 1 - w;
    var playedTeam = dealer;
    var playedLevel = levels[dealer];
    var before = levels.slice();
    var notes = [];

    mainPoints[w] += a.gain;
    counts[w][String(a.gain)]++;

    if (levels[w] === LEVEL_A) {
      var ownA = playedTeam === w;
      var canPass = winPassesA(rules, a.gain) && (ownA || !rules.passARequireOwnLevel);
      if (canPass) {
        levels[w] = LEVEL_PASS;
        winner = w;
        notes.push(match.names[w] + '过A，获胜！');
      } else if (ownA) {
        aFails[w]++;
        notes.push(match.names[w] + '打A未过（' + posText(w === 0 ? a.ourPos : a.oppPos) + '）第' + aFails[w] + '次');
      } else {
        notes.push(match.names[w] + '已在A，夺回庄位，下副打A');
      }
    } else {
      levels[w] = Math.min(LEVEL_A, levels[w] + a.gain);
      if (before[w] + a.gain > LEVEL_A) notes.push('A必打，升至A为止');
    }

    // 败方若正在打自己的A，记一次失败
    var lostOwnA = winner === null && before[l] === LEVEL_A && playedTeam === l;
    if (lostOwnA) {
      aFails[l]++;
      notes.push(match.names[l] + '打A失败第' + aFails[l] + '次');
    }

    if (winner === null && rules.aFailLimit > 0) {
      for (var t = 0; t < 2; t++) {
        if (aFails[t] >= rules.aFailLimit) {
          levels[t] = rules.aFailReturn;
          aFails[t] = 0;
          notes.push(match.names[t] + '打A' + rules.aFailLimit + '次不过，回到' + levelName(rules.aFailReturn));
        }
      }
    }

    // 可选：失去庄位（坐庄打A却输掉本副）时失败次数清零
    if (lostOwnA && rules.aFailResetOnLoseDeal && aFails[l] > 0) {
      aFails[l] = 0;
      notes.push(match.names[l] + '失去庄位，打A失败次数清零');
    }

    dealer = w;
    records.push({
      no: i + 1,
      code: a.code,
      ourPos: a.ourPos,
      oppPos: a.oppPos,
      winner: w,
      gain: a.gain,
      playedTeam: playedTeam,
      playedLevel: playedLevel,
      levelsBefore: before,
      levelsAfter: levels.slice(),
      aFails: aFails.slice(),
      notes: notes,
      summary: describe(match.names, a)
    });
  }

  var finished = winner !== null || !!match.manualEnd;
  var finalWinner = winner;
  var endReason = winner !== null ? 'passA' : (match.manualEnd ? 'manual' : null);
  if (winner === null && match.manualEnd) {
    finalWinner = levels[0] > levels[1] ? 0 : levels[1] > levels[0] ? 1 : -1; // -1 平局
  }
  var diff = Math.abs(levels[0] - levels[1]);
  var leader = levels[0] > levels[1] ? 0 : levels[1] > levels[0] ? 1 : -1;
  return {
    levels: levels,
    levelNames: [levelName(levels[0]), levelName(levels[1])],
    dealer: dealer,
    currentLevel: levels[dealer],
    currentLevelName: levelName(levels[dealer]),
    aFails: aFails,
    mainPoints: mainPoints,
    counts: counts,
    handCount: records.length,
    records: records,
    finished: finished,
    winner: finalWinner,
    endReason: endReason,
    levelDiff: diff,
    leader: leader,
    score26: score26(levels[0] - levels[1])
  };
}

function describe(names, a) {
  var w = a.winner;
  return names[0] + ' ' + posText(a.ourPos) + ' / ' + names[1] + ' ' + posText(a.oppPos) +
    ' → ' + names[w] + '升' + a.gain + '级';
}

/** 预览：输入前给出确认文字 */
function preview(match, code) {
  return describe(match.names, analyze(code));
}

/** 26分制级差分（国家规则换算表），diff = 本方级 - 对方级；返回 [本方, 对方] */
function score26(diff) {
  var d = Math.min(13, Math.abs(diff));
  var hi = 13 + d, lo = 13 - d;
  return diff >= 0 ? [hi, lo] : [lo, hi];
}

function addHand(match, code, now) {
  analyze(code); // 校验
  var st = replay(match);
  if (st.finished) throw new Error('比赛已结束');
  var m = clone(match);
  m.hands.push({ code: code, t: now == null ? Date.now() : now });
  return m;
}

function undoHand(match) {
  var m = clone(match);
  if (m.manualEnd) { m.manualEnd = null; return m; }
  if (!m.hands.length) throw new Error('没有可撤销的记录');
  m.hands.pop();
  return m;
}

function endManually(match, now) {
  var m = clone(match);
  if (!replay(m).finished) m.manualEnd = { at: now == null ? Date.now() : now };
  return m;
}

function clone(o) { return JSON.parse(JSON.stringify(o)); }

/** 跨比赛统计（按队名聚合） */
function globalStats(matches) {
  var teams = {};
  var total = 0, draws = 0, handsTotal = 0;
  function get(n) {
    if (!teams[n]) teams[n] = { name: n, played: 0, wins: 0, hands: 0, handWins: 0, doubles: 0, d13: 0, d14: 0, mainPoints: 0 };
    return teams[n];
  }
  (matches || []).forEach(function (m) {
    var st = replay(m);
    if (!st.finished) return;
    total++;
    handsTotal += st.handCount;
    if (st.winner === -1) draws++;
    for (var t = 0; t < 2; t++) {
      var s = get(m.names[t]);
      s.played++;
      if (st.winner === t) s.wins++;
      s.hands += st.handCount;
      s.doubles += st.counts[t]['3'];
      s.d13 += st.counts[t]['2'];
      s.d14 += st.counts[t]['1'];
      s.handWins += st.counts[t]['3'] + st.counts[t]['2'] + st.counts[t]['1'];
      s.mainPoints += st.mainPoints[t];
    }
  });
  var list = Object.keys(teams).map(function (k) {
    var s = teams[k];
    s.winRate = s.played ? Math.round(s.wins * 1000 / s.played) / 10 : 0;
    s.doubleRate = s.hands ? Math.round(s.doubles * 1000 / s.hands) / 10 : 0;
    return s;
  }).sort(function (a, b) { return b.wins - a.wins || b.played - a.played; });
  return { matches: total, draws: draws, hands: handsTotal, teams: list };
}

module.exports = {
  LEVEL_MIN: LEVEL_MIN, LEVEL_A: LEVEL_A, LEVEL_PASS: LEVEL_PASS,
  RESULTS: RESULTS, DEFAULT_RULES: DEFAULT_RULES, PASS_A_WINS: PASS_A_WINS,
  normalizeRules: normalizeRules, ruleSummary: ruleSummary,
  levelName: levelName, analyze: analyze, createMatch: createMatch, replay: replay,
  preview: preview, score26: score26, addHand: addHand, undoHand: undoHand,
  endManually: endManually, globalStats: globalStats, posText: posText
};
</script>

  function build(m) {

      if (st.winner === -1) { winnerText = '平局（同为' + st.levelNames[0] + '）'; /* 纯文本，渲染时统一转义（画布里不能有实体） */ headline = '战平 · 同为' + st.levelNames[0]; }
      else {
        winnerText = n[st.winner] + ' 获胜' + (st.endReason === 'passA' ? '（过A）' : '（级数领先，手动结束）');

  /** 记仇卡；anim: 'all'（详情打开时依次翻入）| 某个 id（只翻入刚记下的那张）| null */

      var create = function () {
        var cur = store.getCurrent();
        if (cur && cur.hands.length && !store.archive(cur)) { toast('旧比赛存档失败，已取消新建'); return; }
        var m = S.createMatch(opts);
        store.saveCurrent(m);
        store.savePrefs({ nameA: m.names[0], nameB: m.names[1], rules: m.rules });
        go('index');
      };
      var cur = store.getCurrent();
      if (cur && cur.hands.length && !S.replay(cur).finished) confirmBox('提示', '当前比赛尚未结束，将按当前级数结束并存入历史，然后开始新比赛。', create);
      else create();
    }
  };

  /** 0 副的比赛不存档、不计统计：确认后直接放弃 */
  function discardEmpty() {
    confirmBox('放弃本场', '本场还没有录入任何一副，不会存入历史，也不计入统计。确定放弃这场比赛？', function () { store.clearCurrent(); toast('已放弃本场'); render(); });
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el && actions[el.getAttribute('data-act')]) actions[el.getAttribute('data-act')](el);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs a'), function (a) { a.onclick = function () { go(a.getAttribute('data-tab')); }; });
  $('back').onclick = function () { window.gdBack(); };

  /** 返回键：关闭弹窗/长图/表单 → 详情回历史 → 其他页回计分 → 退出（返回 false 交给原生处理） */
  window.gdBack = function () {
    if (dlgOpen()) { closeDlg(false); return true; }
    if (shareOpen()) { closeShare(); return true; }
    if (sheetOpen()) { closeSheet(); return true; }
    if (route.detailId) { route.detailId = null; render(); return true; }
    if (route.tab !== 'index') { go('index'); return true; }
    return false;
  };
  // 手机浏览器兼容（1.1.2，t42u）
  // 1) 微信（安卓 X5/XWeb）“设置-字体大小”会整体放大网页字号，排版会被撑破；这里把网页字号固定为标准档。
  function wxFont() { try { var B = window.WeixinJSBridge; B.invoke('setFontSizeCallback', { fontSize: 0 }); B.on('menu:setfont', function () { B.invoke('setFontSizeCallback', { fontSize: 0 }); }); } catch (e) {} }
  if (window.WeixinJSBridge && typeof window.WeixinJSBridge.invoke === 'function') wxFont(); else document.addEventListener('WeixinJSBridgeReady', wxFont, false);
  // 2) 输入时隐藏底部导航（安卓键盘会把 fixed 导航顶上来挡住输入框）；iOS 微信收起键盘后页面可能留白，滚动一下强制重排。
  var kbTimer = null;
  function isText(el) { return el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/i.test(el.type || ''))); }
  document.addEventListener('focusin', function (e) { if (isText(e.target)) { clearTimeout(kbTimer); document.body.classList.add('kb'); } }, false);
  document.addEventListener('focusout', function (e) {
    if (!isText(e.target)) return;
    clearTimeout(kbTimer);
    kbTimer = setTimeout(function () {
      if (isText(document.activeElement)) return;
      document.body.classList.remove('kb');
      var y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0; window.scrollTo(0, y);
    }, 120);
  }, false);
  window.gdActions = actions; window.gdGo = go; window.gdShareImage = drawShare; // 测试用

  render();
})();
</script>
<script>
(function(){ /* browser/phone back key: step back inside the app first */
  try{
    if(!window.history||!history.pushState)return;
    history.replaceState({gd:0},'');history.pushState({gd:1},'');
    window.addEventListener('popstate',function(){
      var handled=false; try{handled=window.gdBack&&window.gdBack();}catch(e){}
      if(handled){history.pushState({gd:1},'');} else {history.back();}
    });
  }catch(e){}
})();
</script>
